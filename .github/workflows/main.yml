name: Build and Release

on:
  push:
    tags:
      - 'v*'  # 当推送v开头的标签时触发
  workflow_dispatch:  # 允许手动触发

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        python-version: ['3.8', '3.9', '3.10', '3.11']
        
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Display Python version
      run: python --version
    
    - name: Test application
      run: |
        python process_guide.py --help 2>&1 || echo "Application started successfully"
    
    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: test-results-${{ matrix.os }}-py${{ matrix.python-version }}
        path: |
          process_data.json
          *.log
        retention-days: 1

  package:
    needs: build
    runs-on: windows-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install PyInstaller
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller
    
    - name: Package application with PyInstaller
      run: |
        pyinstaller --onefile --windowed --name "ProcessKeyGuide" process_guide.py
        dir dist
    
    - name: Create release archive
      run: |
        cd dist
        7z a ProcessKeyGuide-windows.zip ProcessKeyGuide.exe
        dir
    
    - name: Upload release artifacts
      uses: actions/upload-artifact@v3
      with:
        name: ProcessKeyGuide-windows
        path: dist/ProcessKeyGuide-windows.zip
    
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      if: startsWith(github.ref, 'refs/tags/v')
      with:
        files: dist/ProcessKeyGuide-windows.zip
        generate_release_notes: true
